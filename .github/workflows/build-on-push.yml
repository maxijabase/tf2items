name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os_short }} ${{ matrix.target_arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target_arch: x86
            os_short: linux
          - os: ubuntu-22.04
            target_arch: x86_64
            os_short: linux64
          - os: windows-latest
            target_arch: x86
            os_short: win
            vs_dev_arch: x86
          - os: windows-latest
            target_arch: x86_64
            os_short: win64
            vs_dev_arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: src

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Stamp version from tag
        working-directory: src
        shell: bash
        run: python .github/stamp-version.py

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y g++-multilib gcc-multilib
          echo "CC=clang-20" >> "$GITHUB_ENV"
          echo "CXX=clang++-20" >> "$GITHUB_ENV"

      - name: Add msbuild to PATH
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      - name: Set up the Visual Studio environment
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq delims=*" %%i in (`vswhere -latest -property installationPath`) do (
            call "%%i"\Common7\Tools\vsdevcmd.bat -arch=${{ matrix.vs_dev_arch }} -host_arch=x64
          )
          for /f "delims== tokens=1,2" %%a in ('set') do (
            echo>>"%GITHUB_ENV%" %%a=%%b
          )

      - name: Set up SourcePawn
        uses: rumblefrog/setup-sp@v1.2.2
        with:
          version: "1.12.x"
          no-spcomp-proxy: true

      - name: Fetch Metamod:Source 1.12-dev
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/metamod-source
          ref: 75dd7b26fe92e535a11f0318ead73c3e05130d0b
          path: mmsource

      - name: Fetch SourceMod 1.12-dev
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/sourcemod
          ref: 03865e00cc124221122ae9798ad38998566f9a2b
          path: sourcemod
          submodules: recursive

      - name: Fetch HL2SDK tf2
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk
          ref: 631a7b6c0cbbb6941cf22e434620911a0bdfd478
          path: hl2sdk-tf2

      - name: Fetch HL2SDK manifests
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk-manifests
          ref: 97c5df831be1cc5e037e5242a9c1d4a049cc61c8
          path: hl2sdk-manifests

      - name: Fetch AMBuild
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/ambuild
          ref: 01212cb57c96561f664b6dfb2ee10e66de6f81e4
          path: ambuild

      - name: Build
        working-directory: src
        shell: bash
        run: |
          python -m pip install "${GITHUB_WORKSPACE}/ambuild"
          mkdir build
          cd build
          python ../configure.py \
            --sdks=tf2 \
            --enable-optimize \
            --sm-path="${GITHUB_WORKSPACE}/sourcemod" \
            --mms-path="${GITHUB_WORKSPACE}/mmsource" \
            --hl2sdk-manifest-path="${GITHUB_WORKSPACE}/hl2sdk-manifests" \
            --targets "${{ matrix.target_arch }}"
          ambuild

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os_short }}-${{ matrix.target_arch }}
          path: src/build/package
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          pattern: linux*
          path: dist/linux
          merge-multiple: true

      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          pattern: win*
          path: dist/windows
          merge-multiple: true

      - name: Pack archives
        run: |
          set -eu
          find dist -maxdepth 3 -type d -print
          test -d dist/linux/addons
          test -d dist/windows/addons
          tar -C dist/linux -czf "tf2items-${GITHUB_REF_NAME}-linux.tar.gz" addons
          (cd dist/windows && zip -r "../../tf2items-${GITHUB_REF_NAME}-windows.zip" addons)

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            tf2items-${{ github.ref_name }}-linux.tar.gz
            tf2items-${{ github.ref_name }}-windows.zip
